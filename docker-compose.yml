services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: llm-paper-rag-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - ./data/qdrant:/qdrant/storage

  api:
    build: .
    container_name: llm-paper-rag-api
    depends_on:
      - qdrant
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
